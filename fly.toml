app = "rainface-backtrader"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8420"
  RAINFACE_BT_PORT = "8420"

[http_service]
  internal_port = 8420
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "backtest_data"
  destination = "/app/datas"
